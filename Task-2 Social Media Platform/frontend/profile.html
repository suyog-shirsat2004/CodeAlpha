<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>ShareSphere - Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="main-nav" class="navbar navbar-expand-sm sticky-top">
    <div class="container">
      <a href="/" class="navbar-brand d-flex align-items-center gap-2 text-white">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
          <circle cx="16" cy="16" r="12" stroke="#a855f7" stroke-width="1.8" fill="none"/>
          <circle cx="16" cy="16" r="2.5" fill="#a855f7"/>
          <circle cx="16" cy="4" r="1.5" fill="#a855f7"/>
          <circle cx="28" cy="16" r="1.5" fill="#a855f7"/>
          <circle cx="4" cy="16" r="1.5" fill="#a855f7"/>
          <circle cx="16" cy="28" r="1.5" fill="#a855f7"/>
        </svg>
        <span class="fw-bold brand-name">ShareSphere</span>
      </a>
      <button class="navbar-toggler border-0 p-2" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-sm-center gap-2">
          <li class="nav-item"><a href="/" class="nav-link nav-icon-link"><i class="bi bi-house-door me-1"></i>Home</a></li>
          <li class="nav-item"><a href="/profile.html" id="nav-profile-link" class="nav-link nav-icon-link active"><i class="bi bi-person me-1"></i>Profile</a></li>
          <li class="nav-item"><a href="#" id="logout-btn" class="btn btn-outline-light btn-sm rounded-pill px-3" style="display:none"><i class="bi bi-box-arrow-right me-1"></i>Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="profile-hero">
    <div class="profile-hero-particles" id="profile-particles"></div>
    <div class="container">
      <div class="row">
        <div class="col-12">
          <div class="profile-hero-content">
            <div class="avatar-wrap">
              <div class="avatar-ring"></div>
              <div class="profile-avatar" id="profile-avatar">U</div>
              <label for="avatar-upload" class="avatar-upload-btn" id="avatar-upload-label" title="Change photo">
                <i class="bi bi-camera"></i>
              </label>
              <input type="file" id="avatar-upload" accept="image/*" style="display:none">
            </div>
            <h1 class="profile-display-name" id="profile-display">User</h1>
            <p class="profile-username" id="profile-username">@username</p>
            <p class="profile-bio" id="profile-bio">No bio yet.</p>
            <div class="profile-stats">
              <div class="stat-item">
                <div class="stat-number" id="profile-post-count">0</div>
                <div class="stat-label">Posts</div>
              </div>
              <div class="stat-item">
                <div class="stat-number" id="profile-followers">0</div>
                <div class="stat-label">Followers</div>
              </div>
              <div class="stat-item">
                <div class="stat-number" id="profile-following">0</div>
                <div class="stat-label">Following</div>
              </div>
            </div>
            <div id="profile-actions" class="profile-actions"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="edit-section" class="container py-3" style="display:none">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow-sm border-0 rounded-4 p-4">
          <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square me-2"></i>Edit Profile</h5>
          <div class="mb-3">
            <label class="form-label fw-semibold">Display Name</label>
            <input type="text" id="edit-display" class="form-control" placeholder="Display Name">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Bio</label>
            <div class="position-relative">
              <textarea id="edit-bio" class="form-control" rows="3" placeholder="Tell us about yourself"></textarea>
              <button id="edit-emoji-btn" class="btn btn-sm position-absolute end-0 top-0 mt-2 me-2 emoji-trigger" style="background:none;font-size:1.1rem">😊</button>
              <div id="edit-emoji-picker" class="emoji-picker"></div>
            </div>
          </div>
          <button id="save-profile-btn" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-check-lg me-1"></i> Save
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="container py-3">
    <div class="row">
      <div class="col-12">
        <ul class="nav nav-tabs profile-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="posts-tab" data-bs-toggle="tab" data-bs-target="#posts-content" type="button" role="tab">
              <i class="bi bi-file-text me-1"></i> Posts
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="likes-tab" data-bs-toggle="tab" data-bs-target="#likes-content" type="button" role="tab">
              <i class="bi bi-heart me-1"></i> Likes
            </button>
          </li>
        </ul>
        <div class="tab-content mt-3">
          <div class="tab-pane fade show active" id="posts-content" role="tabpanel">
            <div id="profile-posts"></div>
          </div>
          <div class="tab-pane fade" id="likes-content" role="tabpanel">
            <div id="profile-likes"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="confetti-container" class="confetti-container"></div>

  <div id="comment-modal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-custom">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Comments</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="comments-list" class="comments-list"></div>
          <div class="d-flex gap-2 mt-3 align-items-center">
            <div class="flex-grow-1 position-relative">
              <input type="text" id="comment-input" class="form-control" placeholder="Write a comment...">
              <button id="comment-emoji-btn" class="btn btn-sm position-absolute end-0 top-50 translate-middle-y border-0 emoji-trigger" style="background:none;font-size:1.1rem">😊</button>
              <div id="comment-emoji-picker" class="emoji-picker"></div>
            </div>
            <button id="comment-btn" class="btn btn-primary"><i class="bi bi-send"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="following-modal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content modal-content-custom">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold"><i class="bi bi-people me-1"></i> Following</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="following-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="followers-modal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content modal-content-custom">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold"><i class="bi bi-people me-1"></i> Followers</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="followers-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="edit-post-modal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-custom">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold"><i class="bi bi-pencil me-1"></i> Edit Post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <textarea id="edit-post-content" class="form-control mb-3" rows="3" placeholder="Edit your post..."></textarea>
          <div id="edit-post-media-preview" class="media-preview-box mb-3" style="display:none">
            <img id="edit-preview-img" class="preview-media" style="display:none">
            <video id="edit-preview-video" class="preview-media" style="display:none" controls></video>
          </div>
          <div class="d-flex gap-2">
            <input type="text" id="edit-post-url" class="form-control" placeholder="Image URL (optional)">
            <button id="edit-post-save" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
