<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShareSphere — Social Media Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #fdf6ed;
      color: #1e1e2a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08);
      padding: 48px 40px;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a855f7, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #5a5a6e;
      font-size: .95rem;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      border-radius: 99px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .btn-primary {
      background: #ff6b35;
      color: #fff;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,107,53,.35);
    }
    .btn-secondary {
      background: #f0f0f5;
      color: #1e1e2a;
      margin-top: 12px;
    }
    .btn-secondary:hover {
      background: #e4e4ed;
    }
    .links { margin-top: 32px; }
    .links a {
      color: #5a5a6e;
      font-size: .85rem;
      text-decoration: none;
      margin: 0 10px;
    }
    .links a:hover { color: #ff6b35; text-decoration: underline; }
    hr { border: none; border-top: 1px solid #eee; margin: 28px 0; }
    .features {
      text-align: left;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: .85rem;
      color: #5a5a6e;
    }
    .features li { list-style: none; padding: 4px 0; }
    .features li::before { content: "✓ "; color: #ff6b35; font-weight: 700; }
    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      .features { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ShareSphere</div>
    <div class="subtitle">Social Media Platform — Express.js + vanilla frontend</div>

    <a href="../" class="btn btn-primary">
      Launch App →
    </a>

    <div class="links">
      <a href="https://github.com/suyog-shirsat2004/CodeAlpha/tree/main/Task-2%20Social%20Media%20Platform">GitHub Repo</a>
      <a href="https://github.com/suyog-shirsat2004/CodeAlpha/tree/main/Task-2%20Social%20Media%20Platform/README.md">README</a>
    </div>

    <hr />

    <ul class="features">
      <li>User profiles &amp; avatars</li>
      <li>Create / edit posts</li>
      <li>Like with confetti</li>
      <li>Comments with delete</li>
      <li>Follow / Unfollow</li>
      <li>Media uploads</li>
      <li>Session auth</li>
      <li>Responsive design</li>
    </ul>
  </div>
</body>
</html>
