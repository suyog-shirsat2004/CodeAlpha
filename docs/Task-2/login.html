<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>ShareSphere - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="main-nav" class="navbar navbar-expand-sm sticky-top">
    <div class="container">
      <a href="." class="navbar-brand d-flex align-items-center gap-2 text-white">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
          <circle cx="16" cy="16" r="12" stroke="#a855f7" stroke-width="1.8" fill="none"/>
          <circle cx="16" cy="16" r="2.5" fill="#a855f7"/>
          <circle cx="16" cy="4" r="1.5" fill="#a855f7"/>
          <circle cx="28" cy="16" r="1.5" fill="#a855f7"/>
          <circle cx="4" cy="16" r="1.5" fill="#a855f7"/>
          <circle cx="16" cy="28" r="1.5" fill="#a855f7"/>
        </svg>
        <span class="fw-bold brand-name">ShareSphere</span>
        <span id="nav-avatar" class="nav-avatar-circle ms-2" style="display:none"></span>
      </a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h3 id="auth-title">Welcome Back</h3>
      </div>
      <div id="auth-error" class="alert alert-danger d-none"></div>
      <form id="auth-form">
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
            <input type="text" id="auth-username" class="form-control border-start-0" placeholder="Username" required>
          </div>
        </div>
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
            <input type="password" id="auth-password" class="form-control border-start-0" placeholder="Password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2" id="auth-submit">Sign In</button>
      </form>
      <p class="text-center mt-3 mb-0 auth-switch">
        <span id="auth-switch-text">New here? <a href="#" id="auth-toggle" class="fw-semibold">Create Account</a></span>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-api.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
